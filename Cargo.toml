[package]
name = "spotify-player"
version = "0.1.0"
edition = "2021"

[dependencies]
librespot-core = { path = "../librespot/core" }
librespot-metadata = { path = "../librespot/metadata" }
librespot-audio = { path = "../librespot/audio" }
librespot-oauth = { path = "../librespot/oauth" }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lofty = "0.22.4"
pathdiff = "0.2"
reqwest = "0.12"
image = "0.25"
async-trait = "0.1"
rodio = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
ogg = "0.9.2"
tempfile = "3.24.0"
vorbis_rs = "0.5.5"

[[test]]
name = "test_m3u_generation"
path = "tests/integration/test_m3u_generation.rs"

[[test]]
name = "test_cover_collage"
path = "tests/integration/test_cover_collage.rs"

[[test]]
name = "test_metadata"
path = "tests/integration/test_metadata.rs"

[[test]]
name = "test_collection_helpers"
path = "tests/integration/test_collection_helpers.rs"

[[test]]
name = "test_error_recovery"
path = "tests/integration/test_error_recovery.rs"

[[test]]
name = "test_temp_file_cleanup"
path = "tests/integration/test_temp_file_cleanup.rs"

[[test]]
name = "test_build_m3u_entry"
path = "tests/integration/test_build_m3u_entry.rs"
