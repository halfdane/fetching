[package]
name = "server"
version = "1.0.1"
edition = "2021"

[lib]
name = "server_lib"
path = "src/lib.rs"

[dependencies]

axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
fetching-core = { path = "../core" }
base64 = "0.22"
hyper = "1"
futures-util = "0.3.32"
async-stream = "0.3.6"
tracing-subscriber = "0.3"
anyhow = "1"
tracing = "0.1.41"
rust-embed = "8.5"
mime_guess = "2.0"
tower = "0.5"
