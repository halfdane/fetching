[package]
name = "fetching-core"
version = "0.1.17"
edition = "2024"

[lib]
name = "fetching_core_lib"
path = "src/lib.rs"

[dependencies]
librespot-core = "0.8.0"
librespot-metadata = "0.8.0"
librespot-audio = "0.8.0"
librespot-oauth = "0.8.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"


[dev-dependencies]
pretty_assertions = "1"
