[package]
name = "fetching-core"
version = "0.1.13"
edition = "2024"

[dependencies]
librespot-core = "0.8.0"
librespot-metadata = "0.8.0"
librespot-audio = "0.8.0"
librespot-oauth = "0.8.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lofty = "0.22.4"
pathdiff = "0.2"
reqwest = "0.12"
image = "0.25"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
ogg = "0.9.2"
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1.21.3"

[dev-dependencies]
tempfile = "3.24.0"
vorbis_rs = "0.5.5"
